name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

env:
  UPSTREAM_REF_FUZZER: '0.7.0'
  UPSTREAM_REF_ARCHIPELAGO: 2c64ef42af2389280d06ad2058e5b4c73d44f981 # 0.6.8 + dev, 2026-11-21T03:47:40.000Z

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Archipelago | Checkout
        uses: actions/checkout@v7.0.1
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{ env.UPSTREAM_REF_ARCHIPELAGO }}
          sparse-checkout: |
            /*
            !/worlds/*/
            /worlds/generic/
            /worlds/apquest/
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "latest"
          python-version: 3.13
          enable-cache: true

      - name: Archipelago | Setup
        run: |
          sudo apt install libcairo2-dev
          uv venv
          uv pip install pip pytest pytest-subtests pytest-xdist
          #find -name requirements.txt | xargs -n1 uv pip install -r
          # --append "WebHostLib/requirements.txt"
          uv run python ModuleUpdate.py --yes --force 
          uv run cythonize -a -i _speedups.pyx
          uv run python Launcher.py --update_settings

      # This needs to be after host.yaml is created (normally or empty) to avoid a deadlock.
      - name: World | Checkout
        uses: actions/checkout@v7.0.1
        with:
          path: worlds/megamix

      - name: Fuzzer | Setup
        uses: actions/checkout@v7.0.1
        with:
          repository: Eijebong/Archipelago-fuzzer
          ref: ${{ env.UPSTREAM_REF_FUZZER }}
          path: fuzzer
      
      - name: Fuzzer | Run
        run: |
          mv ./fuzzer/* .
          uv run python fuzz.py -g megamix -j 2 -r 50

      - name: Fuzzer | Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz_output
          path: fuzz_output/
          
      - name: Fuzzer | Determinism
        run: uv run python fuzz.py -g megamix -j 2 -r 10 -n 1 --hook hooks.determinism:Hook 

      - name: World | Tests
        run: uv run pytest test/general worlds/megamix

      - name: Archipelago | Generate template
        run: |
          uv run python Launcher.py "Generate Template Options"
          cp "./Players/Templates/Hatsune Miku Project Diva Mega Mix+.yaml" .
          AP_VER=$(jq -r '.minimum_ap_version' worlds/megamix/archipelago.json)
          sed -Ei "s/(\s+version: )[0-9\.]+/\1$AP_VER/" "Hatsune Miku Project Diva Mega Mix+.yaml"
            
      - name: Archipelago | Update archipelago.json
        run: PYTHONPATH=. uv run python worlds/megamix/.github/workflows/manifest.py

      - name: World | Zip
        run: |
          rm -rf worlds/megamix/.git* worlds/megamix/*.yaml worlds/megamix/.idea worlds/megamix/sorted_mod_pv_db.txt
          find worlds/megamix/ -type d -iname '__pycache__' -exec rm -r {} +
          7z a -tzip -mm=deflate -mfb=256 -mx9 -mtc- -mta- -mtm- megamix.apworld ./worlds/megamix/

      - name: World | Artifact
        uses: actions/upload-artifact@v6
        with:
          name: artifact-apworld
          path: |
            megamix.apworld
            Hatsune Miku Project Diva Mega Mix+.yaml
